<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#signalGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <!-- Outer Wave -->
    <path d="M 86.29 202.29 A 240 240 0 0 1 425.71 202.29" stroke-width="38" />
    <!-- Middle Wave -->
    <path d="M 142.86 258.86 A 160 160 0 0 1 369.14 258.86" stroke-width="38" />
    <!-- Inner Wave -->
    <path d="M 199.43 315.43 A 80 80 0 0 1 312.57 315.43" stroke-width="38" />
    <!-- Base Dot -->
    <circle cx="256" cy="372" r="28" fill="url(#signalGrad)" stroke="none" />
  </g>
</svg>
